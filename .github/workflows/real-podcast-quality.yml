name: Real Podcast Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takemachine?schema=public
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: stub
      TTS_PROVIDER: stub
      STORAGE_PROVIDER: stub
      SCRIPT_QUALITY_GATE_STRICT: "false"
      TTS_PERFORMANCE_QA_STRICT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Full repository lint baseline
        continue-on-error: true
        run: npm run lint
      - name: Changed-file lint
        run: npm run lint:changed -- origin/main
      - name: TypeScript
        id: typescript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/typescript-errors.log
      - name: Preserve TypeScript failure output
        if: steps.typescript.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-errors
          path: /tmp/typescript-errors.log
          if-no-files-found: error
      - name: Real podcast quality regression
        run: npx tsx --conditions=react-server src/scripts/testRealPodcastQualityGate.ts
      - name: Script queue identity regression
        run: npx tsx --conditions=react-server src/scripts/testScriptQueueTracking.ts
      - name: Cal performance regression
        run: npx tsx --conditions=react-server src/scripts/testCalPerformanceV2.ts
      - name: Host Studio capabilities regression
        run: npx tsx --conditions=react-server src/scripts/testHostStudioCapabilities.ts
      - name: Show Forge capabilities regression
        run: npx tsx --conditions=react-server src/scripts/testShowForgeCapabilities.ts
      - name: Show Forge discoverability regression
        run: npx tsx --conditions=react-server src/scripts/testShowForgeDiscoverability.ts
      - name: Production build contract
        run: npm run build

  studio-e2e:
    needs: quality-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install browser and audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Authenticated Studio Playwright suite
        run: npm run test:e2e
      - name: Upload Studio screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
