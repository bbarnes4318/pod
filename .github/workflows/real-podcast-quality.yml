name: Real Podcast Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takemachine?schema=public
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: stub
      TTS_PROVIDER: stub
      STORAGE_PROVIDER: stub
      SCRIPT_QUALITY_GATE_STRICT: "false"
      TTS_PERFORMANCE_QA_STRICT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/typescript-errors.log
      - name: Preserve TypeScript failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-errors
          path: /tmp/typescript-errors.log
          if-no-files-found: error
      - name: Real podcast quality regression
        run: npx tsx --conditions=react-server src/scripts/testRealPodcastQualityGate.ts
      - name: Independent editorial gate regression
        run: npm run test:editorial-gate
      # These assert PRODUCTION semantics explicitly (they hand NODE_ENV
      # "production" to the gate directly), so the relaxed strictness flags on
      # this job cannot mask a regression the way they did before.
      - name: Production release gate + failed-episode regression
        run: npm run test:production-release-gate
      - name: Semantic repetition regression
        run: npm run test:semantic-repetition
      - name: Opening timing and chapter integrity regression
        run: npm run test:opening-chapter-integrity
      - name: Story clustering and rundown diversity regression
        run: npm run test:story-clustering
      - name: Canary preflight regression
        run: npm run test:canary-preflight
      - name: Provider error classification regression
        run: npm run test:provider-error-classification
      - name: LLM role routing and judge independence
        run: npm run test:llm-role-routing
      # Configuration-only. Fails on a role that resolves to nothing or a judge
      # grading its own output; a single-provider account passes with warnings.
      - name: Role routing audit
        run: npm run audit:llm-routing
      # Security and release-safety suites added after the independent review.
      - name: Voice audition authorization matrix
        run: npm run test:voice-audition-authz
      - name: Listener-signal abuse resistance
        run: npm run test:listener-signal-abuse
      - name: Production readiness false-positive regression
        run: npm run test:production-readiness
      - name: Semantic QA acceptance contract
        run: npm run test:semantic-qa-acceptance
      - name: Voice audition flow regression
        run: npm run test:voice-audition
      - name: Listener learning loop regression
        run: npm run test:listener-learning
      - name: Seven-role writing pipeline regression
        run: npm run test:seven-role-pipeline
      - name: Editorial learning and semantic audio contracts
        run: npm run test:world-class-learning
      - name: Topic freshness and automated research regression
        run: npm run test:topic-freshness
      - name: Deployment and migration manifest contract
        run: npm run test:deployment-contract
      - name: Podcast configuration repair migration
        run: npm run test:podcast-configuration-migration
      - name: Migration adoption auditor
        run: npm run test:migration-adoption
      - name: Script queue identity regression
        run: npx tsx --conditions=react-server src/scripts/testScriptQueueTracking.ts
      - name: Cal performance regression
        run: npx tsx --conditions=react-server src/scripts/testCalPerformanceV2.ts
      - name: Host Studio capabilities regression
        run: npx tsx --conditions=react-server src/scripts/testHostStudioCapabilities.ts
      - name: Show Forge capabilities regression
        run: npx tsx --conditions=react-server src/scripts/testShowForgeCapabilities.ts
      - name: Show Forge discoverability regression
        run: npx tsx --conditions=react-server src/scripts/testShowForgeDiscoverability.ts
      - name: Production chain and scene retry regression
        run: npm run test:production-chain
      - name: Audio stitch orphan recovery regression
        run: npm run test:audio-stitch-recovery
      - name: Production build contract
        run: npm run build
