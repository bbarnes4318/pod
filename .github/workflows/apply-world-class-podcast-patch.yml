name: Apply world-class podcast patch

on:
  push:
    branches:
      - agent/world-class-podcast-core
    paths:
      - scripts/apply-world-class-podcast-patch.mjs
      - .github/workflows/apply-world-class-podcast-patch.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-world-class-podcast-patch.mjs
      - .github/workflows/apply-world-class-podcast-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/world-class-podcast-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded source patch
        run: node scripts/apply-world-class-podcast-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Editorial gate contracts
        run: npm run test:editorial-gate
      - name: Scene provider contracts
        run: npm run test:scene-contracts
      - name: Real podcast deterministic quality regression
        run: npx tsx --conditions=react-server src/scripts/testRealPodcastQualityGate.ts
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce world-class editorial and voice quality"
          git push origin HEAD:agent/world-class-podcast-core
