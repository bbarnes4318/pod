name: Temporary Whisper Base Kit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-whisper-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: v1.8.2
          path: whisper.cpp

      - name: Build static whisper CLI
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j 2

      - name: Download English base quantized model
        run: |
          mkdir -p whisper-base-kit
          curl -L --fail --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin \
            -o whisper-base-kit/ggml-base.en-q5_1.bin
          cp whisper.cpp/build/bin/whisper-cli whisper-base-kit/
          chmod +x whisper-base-kit/whisper-cli
          file whisper-base-kit/whisper-cli
          ls -lh whisper-base-kit

      - name: Upload whisper base kit
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-kit-linux-x64
          path: whisper-base-kit/
          retention-days: 1
          compression-level: 0
