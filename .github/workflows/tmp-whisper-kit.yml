name: Temporary Whisper Kit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-whisper-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: v1.8.2
          path: whisper.cpp

      - name: Build static whisper CLI
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j 2

      - name: Download English quantized model
        run: |
          mkdir -p whisper-kit
          curl -L --fail --retry 3 \
            https://github.com/bnosac/audio.whisper/raw/refs/heads/master/inst/repo/ggml-tiny.en-q5_1.bin \
            -o whisper-kit/ggml-tiny.en-q5_1.bin
          cp whisper.cpp/build/bin/whisper-cli whisper-kit/
          chmod +x whisper-kit/whisper-cli
          file whisper-kit/whisper-cli
          ls -lh whisper-kit

      - name: Upload whisper kit
        uses: actions/upload-artifact@v4
        with:
          name: whisper-kit-linux-x64
          path: whisper-kit/
          retention-days: 1
          compression-level: 0
